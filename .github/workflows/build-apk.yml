name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        # The ubuntu-24.04 image ships the Android SDK; android-actions/setup-android@v3
        # fails on it ("Failed to find package 'tools'"), so we call sdkmanager directly.
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch ReXGlue SDK and apply patches
        run: bash scripts/fetch_sdk.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pacman-ce-debug-apk
          path: app/build/outputs/apk/debug/*.apk
